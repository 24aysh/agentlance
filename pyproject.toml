[project]
name = "agentlance"
version = "0.0.0"
description = "Protocol specifications for the AgentLance decentralized agent market"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.25,<5",
  "a2a-sdk[http-server]==1.2.1",
  "fastapi>=0.115.2,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28.1,<1",
  "httpcore>=1.0.9,<2",
  "eth-account>=0.13.7,<0.14",
  "eth-utils>=5,<6",
  "eth-keys>=0.8,<0.9",
]

[dependency-groups]
dev = [
  "cryptography>=43,<47",
  "pytest>=8,<9",
  "hypothesis>=6,<7",
  "coverage>=7,<8",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["modules", "tests", "apps"]
markers = ["l2socket: real localhost TLS subprocess integration (included by check-l2)"]
pythonpath = ["."]
python_functions = ["test*"]

[tool.coverage.run]
branch = true
source = ["modules/domain", "modules/market_core"]
omit = ["*/test_*.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
