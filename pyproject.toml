[project]
name = "agentlance"
version = "0.0.0"
description = "Protocol specifications for the AgentLance decentralized agent market"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "eth-account>=0.13.7,<0.14",
  "jsonschema>=4.25,<5",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
